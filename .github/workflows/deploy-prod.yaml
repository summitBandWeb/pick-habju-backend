# =============================================================================
# PROD 환경 CI/CD 파이프라인
# =============================================================================
# Trigger: main 브랜치 push
# Target: prod-service (Cloud Run)
# =============================================================================
name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  # GCP 프로젝트 설정
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  GAR_REPOSITORY: pickhabju-repo
  IMAGE_NAME: pickhabju-backend
  SERVICE_NAME: prod-service
  
  # Cloud Run 인스턴스 설정
  MIN_INSTANCES: "0"
  MAX_INSTANCES: "10"

jobs:
  # ===========================================================================
  # 1) 테스트
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 셋업
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ./requirements.txt

      - name: 의존성 설치
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r ./requirements.txt

      - name: 테스트 실행
        id: pytest_run
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.PROD_SUPABASE_KEY }}
          GROOVE_BASE_URL: ${{ secrets.GROOVE_BASE_URL }}
          DREAM_BASE_URL: ${{ secrets.DREAM_BASE_URL }}
          LOGIN_ID: ${{ secrets.LOGIN_ID }}
          LOGIN_PW: ${{ secrets.LOGIN_PW }}
        run: |
          source venv/bin/activate
          pip install pytest-json-report
          pytest --json-report --json-report-file=test_results.json

      - name: 테스트 실패 시 Discord 알림
        if: always() && steps.pytest_run.outcome == 'failure'
        run: |
          if [ -f test_results.json ]; then
            FAILED_TESTS=$(jq -r '.summary.failed // 0' test_results.json)
            FAILED_TEST_DETAILS=$(jq -r '.report.tests[] | select(.outcome == "failed") | .nodeid' test_results.json | head -n 5)
            if [ "$FAILED_TESTS" -gt 0 ]; then
                DETAILS_MESSAGE="**실패한 테스트 개수**: ${FAILED_TESTS}\\n"
                DETAILS_MESSAGE="${DETAILS_MESSAGE}**실패 테스트 목록 (일부)**:\\n\`\`\`\\n${FAILED_TEST_DETAILS}\\n\`\`\`"
            else
                DETAILS_MESSAGE="테스트 실패 상세 정보를 가져올 수 없습니다."
            fi
          else
            DETAILS_MESSAGE="테스트 결과 JSON 파일을 찾을 수 없습니다."
          fi

          curl -H "Content-Type: application/json" -d "{
            \"content\": \"🚨 **[PROD] 테스트 실패!** 배포가 중단되었습니다.\",
            \"embeds\": [
              {
                \"title\": \"실패한 워크플로우 바로가기\",
                \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"color\": 15158332,
                \"fields\": [
                  { \"name\": \"Repository\", \"value\": \"${{ github.repository }}\", \"inline\": true },
                  { \"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"inline\": true },
                  { \"name\": \"Commit\", \"value\": \"\`${{ github.sha }}\`\", \"inline\": true },
                  { \"name\": \"실패 상세\", \"value\": \"${DETAILS_MESSAGE}\", \"inline\": false }
                ]
              }
            ]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}

  # ===========================================================================
  # 2) Build & Deploy to Cloud Run
  # ===========================================================================
  deploy:
    name: Deploy to PROD
    needs: test
    if: ${{ needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # GCP 인증 (Workload Identity Federation)
      # -----------------------------------------------------------------------
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # -----------------------------------------------------------------------
      # Docker 빌드 & Push
      # -----------------------------------------------------------------------
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                     ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:prod-latest

      - name: Push to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:prod-latest

      # -----------------------------------------------------------------------
      # Supabase DB 백업 & 마이그레이션 (Prod)
      # -----------------------------------------------------------------------
      - name: Setup Node.js for Supabase CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backup Prod Database (before migration)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
        run: |
          # 마이그레이션 파일이 있을 때만 백업 실행
          if [ -d "supabase/migrations" ] && [ "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
            echo "📦 Creating database backup before migration..."
            
            # Supabase CLI 설치
            mkdir -p /tmp/supabase-cli
            curl -sSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz -C /tmp/supabase-cli
            sudo mv /tmp/supabase-cli/supabase /usr/local/bin/supabase
            
            # 프로젝트 연결
            supabase link --project-ref ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
            
            # 백업 파일명 (타임스탬프 포함)
            BACKUP_FILE="backup_$(date +%Y%m%d_%H%M%S).sql"
            
            # supabase db dump로 백업 (Direct Connection 자동 사용)
            supabase db dump -f "${BACKUP_FILE}"
            
            echo "✅ Backup created: ${BACKUP_FILE}"
            echo "📊 Backup size: $(du -h ${BACKUP_FILE} | cut -f1)"
            
            # 백업 파일을 Artifact로 업로드 (GitHub에 30일간 보관)
            echo "BACKUP_FILE=${BACKUP_FILE}" >> $GITHUB_ENV
          else
            echo "ℹ️ No migration files found, skipping backup..."
          fi

      - name: Upload Database Backup
        if: env.BACKUP_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.sha }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Run Supabase Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
        run: |
          # 마이그레이션 파일이 있는지 확인
          if [ -d "supabase/migrations" ] && [ "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
            echo "🔄 Applying database migrations..."
            
            # Supabase CLI 설치 (Linux용 바이너리 다운로드)
            mkdir -p /tmp/supabase-cli
            curl -sSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz -C /tmp/supabase-cli
            sudo mv /tmp/supabase-cli/supabase /usr/local/bin/supabase
            
            # 프로젝트 연결 (환경변수로 지정)
            supabase link --project-ref ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
            
            # 마이그레이션 적용
            supabase db push
            echo "✅ Migrations applied successfully"
          else
            echo "ℹ️ No migration files found, skipping..."
          fi

      # -----------------------------------------------------------------------
      # Cloud Run 배포
      # -----------------------------------------------------------------------
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: |
            --min-instances=${{ env.MIN_INSTANCES }}
            --max-instances=${{ env.MAX_INSTANCES }}
            --cpu-boost
            --allow-unauthenticated
          env_vars: |
            LOGIN_ID=${{ secrets.LOGIN_ID }}
            LOGIN_PW=${{ secrets.LOGIN_PW }}
            GROOVE_BASE_URL=${{ secrets.GROOVE_BASE_URL }}
            DREAM_BASE_URL=${{ secrets.DREAM_BASE_URL }}
            PYTHONPATH=${{ secrets.PYTHONPATH }}
            CORS_ALLOWED_ORIGINS=${{ secrets.PROD_CORS_ALLOWED_ORIGINS }}
            CORS_ORIGIN_REGEX=${{ secrets.PROD_CORS_ORIGIN_REGEX }}
            SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.PROD_SUPABASE_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            RATE_LIMIT_PER_MINUTE=${{ secrets.RATE_LIMIT_PER_MINUTE }}
            APP_ENV=production
            DISCORD_HEALTH_REPORT_WEBHOOK_URLL=${{ secrets.DISCORD_HEALTH_REPORT_WEBHOOK_URL }}

      # -----------------------------------------------------------------------
      # Discord 알림
      # -----------------------------------------------------------------------
      - name: Discord 배포 성공 알림
        if: success()
        run: |
          curl -H "Content-Type: application/json" -d '{
            "content": "🚀 **[PROD 서버] Cloud Run 배포 성공!**",
            "embeds": [
              {
                "title": "배포된 워크플로우 바로가기",
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "color": 3066993,
                "fields": [
                  { "name": "Service", "value": "`${{ env.SERVICE_NAME }}`", "inline": true },
                  { "name": "Region", "value": "`${{ env.REGION }}`", "inline": true },
                  { "name": "Branch", "value": "`${{ github.ref_name }}`", "inline": true },
                  { "name": "Commit", "value": "`${{ github.sha }}`", "inline": true },
                  { "name": "URL", "value": "${{ steps.deploy.outputs.url }}", "inline": false }
                ]
              }
            ]
          }' ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Discord 배포 실패 알림
        if: failure()
        run: |
          curl -H "Content-Type: application/json" -d '{
            "content": "🚨 **[PROD 서버] Cloud Run 배포 실패!**",
            "embeds": [
              {
                "title": "실패한 워크플로우 바로가기",
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "color": 15158332,
                "fields": [
                  { "name": "Service", "value": "`${{ env.SERVICE_NAME }}`", "inline": true },
                  { "name": "Branch", "value": "`${{ github.ref_name }}`", "inline": true },
                  { "name": "Commit", "value": "`${{ github.sha }}`", "inline": true }
                ]
              }
            ]
          }' ${{ secrets.DISCORD_WEBHOOK_URL }}

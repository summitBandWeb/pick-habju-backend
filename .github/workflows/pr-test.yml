# =============================================================================
# PR 테스트 자동화 (CI)
# =============================================================================
# Trigger: dev, main 브랜치 대상 PR (opened, synchronize)
# 목적: 머지 전 테스트 실패를 사전에 감지
# =============================================================================
name: PR Test

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev
      - main

permissions:
  pull-requests: write
  contents: read

jobs:
  # ===========================================================================
  # 테스트
  # ===========================================================================
  test:
    name: PR Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 셋업
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ./requirements.txt

      - name: 의존성 설치
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r ./requirements.txt

      - name: 테스트 실행
        id: pytest_run
        env:
          SUPABASE_URL: ${{ secrets.ALPHA_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.ALPHA_SUPABASE_KEY }}
          GROOVE_BASE_URL: ${{ secrets.GROOVE_BASE_URL }}
          DREAM_BASE_URL: ${{ secrets.DREAM_BASE_URL }}
          LOGIN_ID: ${{ secrets.LOGIN_ID }}
          LOGIN_PW: ${{ secrets.LOGIN_PW }}
        continue-on-error: true
        run: |
          source venv/bin/activate
          pip install pytest-json-report
          pytest --json-report --json-report-file=test_results.json

      # -----------------------------------------------------------------
      # PR 코멘트: 테스트 성공
      # -----------------------------------------------------------------
      - name: PR 코멘트 - 테스트 성공
        if: always() && steps.pytest_run.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '';

            if (fs.existsSync('test_results.json')) {
              const results = JSON.parse(fs.readFileSync('test_results.json', 'utf8'));
              const s = results.summary || {};
              const total = s.total || 0;
              const passed = s.passed || 0;
              const duration = (results.duration || 0).toFixed(2);
              summary = `| 항목 | 결과 |\n|---|---|\n| 전체 | ${total}개 |\n| 통과 | ✅ ${passed}개 |\n| 소요 시간 | ${duration}s |`;
            }

            const body = [
              `## ✅ PR 테스트 통과`,
              ``,
              summary,
              ``,
              `> [워크플로우 상세 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            ].join('\n');

            // 이전 봇 코멘트 삭제 (중복 방지)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments) {
              if (comment.user.type === 'Bot' && (comment.body.includes('## ✅ PR 테스트 통과') || comment.body.includes('## ❌ PR 테스트 실패'))) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # -----------------------------------------------------------------
      # PR 코멘트: 테스트 실패
      # -----------------------------------------------------------------
      - name: PR 코멘트 - 테스트 실패
        if: always() && steps.pytest_run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '';
            let failedList = '';

            if (fs.existsSync('test_results.json')) {
              const results = JSON.parse(fs.readFileSync('test_results.json', 'utf8'));
              const s = results.summary || {};
              const total = s.total || 0;
              const passed = s.passed || 0;
              const failed = s.failed || 0;
              const duration = (results.duration || 0).toFixed(2);
              summary = `| 항목 | 결과 |\n|---|---|\n| 전체 | ${total}개 |\n| 통과 | ✅ ${passed}개 |\n| 실패 | ❌ ${failed}개 |\n| 소요 시간 | ${duration}s |`;

              // 실패한 테스트 목록 (최대 10개)
              const tests = (results.report?.tests || results.tests || []);
              const failedTests = tests.filter(t => t.outcome === 'failed').slice(0, 10);
              if (failedTests.length > 0) {
                failedList = '### 실패한 테스트\n```\n' + failedTests.map(t => t.nodeid).join('\n') + '\n```';
              }
            }

            const body = [
              `## ❌ PR 테스트 실패`,
              ``,
              summary,
              ``,
              failedList,
              ``,
              `> [워크플로우 상세 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            ].join('\n');

            // 이전 봇 코멘트 삭제 (중복 방지)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments) {
              if (comment.user.type === 'Bot' && (comment.body.includes('## ✅ PR 테스트 통과') || comment.body.includes('## ❌ PR 테스트 실패'))) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # -----------------------------------------------------------------
      # Discord 알림: 테스트 실패
      # -----------------------------------------------------------------
      - name: 테스트 실패 시 Discord 알림
        if: always() && steps.pytest_run.outcome == 'failure'
        run: |
          if [ -f test_results.json ]; then
            FAILED_TESTS=$(jq -r '.summary.failed // 0' test_results.json)
            FAILED_TEST_DETAILS=$(jq -r '.report.tests[] | select(.outcome == "failed") | .nodeid' test_results.json | head -n 5)
            if [ "$FAILED_TESTS" -gt 0 ]; then
                DETAILS_MESSAGE="**실패한 테스트 개수**: ${FAILED_TESTS}\\n"
                DETAILS_MESSAGE="${DETAILS_MESSAGE}**실패 테스트 목록 (일부)**:\\n\`\`\`\\n${FAILED_TEST_DETAILS}\\n\`\`\`"
            else
                DETAILS_MESSAGE="테스트 실패 상세 정보를 가져올 수 없습니다."
            fi
          else
            DETAILS_MESSAGE="테스트 결과 JSON 파일을 찾을 수 없습니다."
          fi

          curl -H "Content-Type: application/json" -d "{
            \"content\": \"🔍 **[PR 테스트 실패]** 머지 전 확인이 필요합니다.\",
            \"embeds\": [
              {
                \"title\": \"실패한 워크플로우 바로가기\",
                \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"color\": 15158332,
                \"fields\": [
                  { \"name\": \"PR\", \"value\": \"#${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}\", \"inline\": false },
                  { \"name\": \"Branch\", \"value\": \"\`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`\", \"inline\": true },
                  { \"name\": \"Author\", \"value\": \"${{ github.event.pull_request.user.login }}\", \"inline\": true },
                  { \"name\": \"실패 상세\", \"value\": \"${DETAILS_MESSAGE}\", \"inline\": false }
                ]
              }
            ]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}

      # -----------------------------------------------------------------
      # 최종 상태 체크 (PR 체크 실패 반영)
      # -----------------------------------------------------------------
      - name: 테스트 결과 확인
        if: always() && steps.pytest_run.outcome == 'failure'
        run: exit 1
